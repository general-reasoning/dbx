name: dbx
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    # Everything dbx declares, from one source of truth: core deps plus the
    # ray / torch / streaming / azure / dev extras. Listing packages here as
    # well let this file drift from pyproject.toml -- it named fsspec, pandas,
    # ray and mosaicml-streaming, but never torch, scikit-learn or adlfs, so a
    # freshly created env could not run what the accumulated one could.
    - -e .[all]
    # [ray] asks only for ray itself; the dashboard and its dependencies come
    # with the [default] extra, which is what makes a local cluster observable.
    - ray[default]
