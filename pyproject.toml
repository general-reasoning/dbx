[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datablocks"
version = "0.0.3"
description = "Config-addressed, journaled data-experiment management for Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Dmitry Karpeyev", email = "dmitry.karpeyev@gmail.com" },
]
keywords = [
    "data",
    "experiment",
    "management",
    "pipeline",
    "reproducibility",
    "datablock",
    "journaling",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fsspec>=2023.1.0",
    "gitpython>=3.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pyyaml>=6.0",
    # Core, not an extra: dbx.probes imports sklearn at module scope --
    # unguarded, unlike torch beside it -- and dbx/__init__ imports probes,
    # so without this `import dbx` itself fails.
    "scikit-learn>=1.9.0",
    "tqdm>=4.60",
]

[project.optional-dependencies]
ray = [
    "ray>=2.0",
]
torch = [
    "torch>=2.0",
]
streaming = [
    # dbx.datastreams only; needs torch too, hence the self-reference.
    "datablocks[torch]",
    "mosaicml-streaming>=0.7",
]
lightning = [
    # dbx.stills only, which imports lightning at module scope -- which is
    # why dbx/__init__.py does not import it, exactly as for dbx.datastreams.
    "datablocks[torch]",
    "lightning>=2.0",
    # Still builds a TensorBoardLogger unconditionally, so this is a hard
    # requirement of a training run and not an extra on top of one. lightning
    # does not declare it: it raises "Neither `tensorboard` nor `tensorboardX`
    # is available" at Trainer construction instead, which is late, and which
    # arrived here as an error in TestWarmStart rather than as a missing
    # dependency.
    "tensorboard>=2.12",
]
azure = [
    # The fsspec driver for abfs:// and abfss:// urls. Nothing imports it --
    # fsspec resolves it from the url -- so its absence surfaces only when a
    # block is given one, as "Protocol not known: abfss".
    "adlfs>=2023.1",
]
hyp = [
    # hyp, the app: a text space -- by default, a datalake's pipelines -- on
    # the Poincare disk. A package of its own, in this distribution so that it
    # shares dbx's env and setup; nothing in dbx imports it.
    "pygame-ce>=2.5",
    "requests>=2.28",
    "umap-learn>=0.5.5",
    # ssh:// datalakes, through fsspec: asyncssh, which reads ~/.ssh/config.
    "sshfs>=2024.0",
    # hyp --docs: markdown parsed by markdown-it; pdfs read and rendered by
    # pdfium. Mermaid diagrams need the mermaid CLI, mmdc, which is not a
    # python package: npm install -g @mermaid-js/mermaid-cli.
    "markdown-it-py>=3.0",
    "pypdfium2>=4.30",
]
hyp-deepseek = [
    # hyp --embedder deepseek: DeepSeek publishes no embedding model and
    # Ollama will not embed with a generative one, so its hidden states are
    # pooled through transformers. Large, and not in [all].
    "datablocks[hyp,torch]",
    "transformers>=4.40",
]
dev = [
    "build",
    "pytest>=8.0",
    "pytest-xdist",           # pytest -n auto: the suite across processes
    "twine",
]
all = [
    "datablocks[ray,torch,streaming,lightning,azure,hyp,dev]",
]

[project.urls]
Homepage = "https://github.com/dmitry-karpeyev/datablocks"
Repository = "https://github.com/dmitry-karpeyev/datablocks"
Issues = "https://github.com/dmitry-karpeyev/datablocks/issues"

[project.scripts]
dbx = "dbx:exec"
"dbx.exec" = "dbx:exec"
"dbx.eval" = "dbx:eval"
"dbx.print" = "dbx:pprint"
"dbx.pprint" = "dbx:pprint"
"dbx.valid" = "dbx:valid"
"dbx.slurm.exec" = "dbx:slurm_exec"
"dbx.slurm.eval" = "dbx:slurm_eval"
"dbx.slurm.print" = "dbx:slurm_pprint"
"dbx.slurm.pprint" = "dbx:slurm_pprint"
hyp = "hyp.app:main"

[tool.setuptools.packages.find]
include = ["dbx*", "hyp*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A marker that quietly does not apply is worse than no marker: a misspelled
# `pinned` would leave the test looking guarded while the failure report said
# nothing. Unregistered markers are a collection error, not a warning.
addopts = "--strict-markers"
markers = [
    # A pinned test states an invariant the code must satisfy, not a shape the
    # code currently has. When one fails, the CODE is wrong: fix it, do not
    # edit the test to agree with the new behaviour. Removing or relaxing a
    # pinned assertion needs a deliberate decision that the invariant no longer
    # holds -- which is a design change, not a test fix.
    "pinned: an invariant; a failure is a regression, so fix the code not the test",
]
